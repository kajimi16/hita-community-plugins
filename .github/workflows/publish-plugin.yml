name: Publish Plugin

# 作者提交仓库地址与模块；build job 只读构建，publish job 才持有写权限。
# 目标仓库需与 hita-plugin-template 结构一致（自带 gradlew 与 libs）。
on:
  workflow_dispatch:
    inputs:
      repo:
        description: '插件仓库（owner/name 或 HTTPS URL）'
        required: true
        default: 'kajimi16/hita-community-plugins'
      ref:
        description: '分支或 tag'
        required: false
        default: 'master'
      module:
        description: 'Gradle 模块，例如 :anime-plugin'
        required: true
        default: ':anime-plugin'
      kind:
        description: '插件类型'
        type: choice
        options: [ui, dex]
        default: ui
      plugin_id:
        description: '插件 id（与 plugin.json 一致）'
        required: true
        default: 'com.stupidtree.hita.ui.anime'
      name:
        description: '展示名称'
        required: true
        default: '番剧'
      version:
        description: '插件版本'
        required: true
        default: '0.3.0'
      entry_class:
        description: '入口类'
        required: true
        default: 'com.stupidtree.hita.ui.anime.AnimeUiPlugin'
      min_host_api:
        description: '最低宿主 API'
        required: true
        default: '5'
      description:
        description: '简介'
        required: false
        default: ''
      changelog:
        description: '更新日志'
        required: false
        default: ''
      tags:
        description: '逗号分隔标签'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Normalize repository
        id: meta
        run: |
          REPO="${{ inputs.repo }}"
          REPO="${REPO#https://github.com/}"
          REPO="${REPO#http://github.com/}"
          REPO="${REPO%.git}"
          echo "slug=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          path: registry-src
          persist-credentials: false

      - name: Checkout external plugin source
        if: steps.meta.outputs.slug != github.repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.slug }}
          ref: ${{ inputs.ref }}
          path: plugin-src
          persist-credentials: false

      - name: Refresh contract libs
        if: steps.meta.outputs.slug != github.repository
        run: |
          mkdir -p plugin-src/libs
          cp registry-src/libs/*.aar plugin-src/libs/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build plugin
        env:
          MODULE: ${{ inputs.module }}
          KIND: ${{ inputs.kind }}
          SRC: ${{ steps.meta.outputs.slug != github.repository && 'plugin-src' || 'registry-src' }}
        run: |
          set -e
          cd "$SRC"
          chmod +x gradlew || true
          if [ "$KIND" = "ui" ]; then
            ./gradlew "$MODULE:assembleRelease" --no-daemon
          else
            ./gradlew "$MODULE:buildPluginDex" --no-daemon
          fi

      - name: Stage artifact
        env:
          KIND: ${{ inputs.kind }}
          SRC: ${{ steps.meta.outputs.slug != github.repository && 'plugin-src' || 'registry-src' }}
        run: |
          set -e
          if [ "$KIND" = "ui" ]; then
            ART=$(find "$SRC" -path '*/build/outputs/apk/release/*.apk' | head -n1)
            EXT=apk
          else
            ART=$(find "$SRC" -path '*/build/plugin-dex/classes.dex' | head -n1)
            EXT=dex
          fi
          test -n "$ART"
          mkdir -p artifact
          cp "$ART" "artifact/plugin.$EXT"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-artifact
          path: artifact/plugin.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-artifact
          path: artifact

      - name: Publish artifact and update registry
        env:
          KIND: ${{ inputs.kind }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          ENTRY_CLASS: ${{ inputs.entry_class }}
          MIN_HOST_API: ${{ inputs.min_host_api }}
          DESCRIPTION: ${{ inputs.description }}
          CHANGELOG: ${{ inputs.changelog }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -e
          EXT=$([ "$KIND" = "ui" ] && echo apk || echo dex)
          SRC="artifact/plugin.$EXT"
          test -f "$SRC"
          if [ "$KIND" = "ui" ]; then
            unzip -p "$SRC" assets/plugin.json > /tmp/plugin-meta.json
            PLUGIN_ID="$PLUGIN_ID" VERSION="$VERSION" ENTRY_CLASS="$ENTRY_CLASS"               MIN_HOST_API="$MIN_HOST_API" python3 - <<'PY'
          import json, os
          m = json.load(open("/tmp/plugin-meta.json"))
          expected = {
              "id": os.environ["PLUGIN_ID"],
              "version": os.environ["VERSION"],
              "entryClass": os.environ["ENTRY_CLASS"],
          }
          errors = [f"{k}: {m.get(k)!r} != {v!r}" for k, v in expected.items() if m.get(k) != v]
          if m.get("apiVersion") != int(os.environ["MIN_HOST_API"]):
              errors.append(f"apiVersion: {m.get('apiVersion')!r} != {os.environ['MIN_HOST_API']!r}")
          if errors:
              raise SystemExit("plugin.json mismatch: " + "; ".join(errors))
          print("plugin.json verified")
          PY
          fi
          REPO_SLUG="${{ inputs.repo }}"
          REPO_SLUG="${REPO_SLUG#https://github.com/}"
          REPO_SLUG="${REPO_SLUG#http://github.com/}"
          REPO_SLUG="${REPO_SLUG%.git}"
          mkdir -p dist
          OUT="dist/${PLUGIN_ID}-${VERSION}.${EXT}"
          cp "$SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$OUT")
          python3 scripts/update_registry.py \
            --kind "$KIND" --id "$PLUGIN_ID" --name "$NAME" --version "$VERSION" \
            --url "../$OUT" --sha256 "$SHA" --size "$SIZE" \
            --entry-class "$ENTRY_CLASS" --min-host-api "$MIN_HOST_API" \
            --description "$DESCRIPTION" --changelog "$CHANGELOG" \
            --repo "https://github.com/${REPO_SLUG}" \
            --author "${{ github.actor }}" --tags "$TAGS" \
            --updated-at "$(date -u +%Y-%m-%d)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist registry/index.json
          git commit -m "publish: ${{ inputs.plugin_id }} ${{ inputs.version }}" || echo "no changes"
          git push
